# Mongo only, deliberately.
#
# The scraper, the apply agent and classify_service all launch Chrome itself
# (channel="chrome", headless=False) on a residential Indian IP, so the backend
# runs locally under uvicorn and the frontend under vite. A backend and a
# frontend service used to sit here; neither was ever built or started, and
# .env points at localhost:27017 rather than mongo:27017 because of it.
# See README, which only ever documents `docker compose up -d mongo`.

services:
  mongo:
    image: mongo:7
    container_name: jobhunt-mongo
    ports:
      - "27017:27017"          # published so a locally-run backend can reach it
    volumes:
      - mongo-data:/data/db    # named volume => data persists across restarts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
